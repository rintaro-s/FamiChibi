<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FamiChibi</title>
<style>
  :root { --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#EAE6E1; --divider:#D4CFC8; --text:#1A1A1A; --text-secondary:#6B6660; --accent:#C45C3E; --accent-text:#FFFFFF; --danger:#B5423F; --ok:#3E7C5C; --voice:#3E6C8C; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  button, input, select, textarea { font-family:inherit; color:inherit; }
  button { cursor:pointer; border:none; background:none; }
  #app { height:100%; display:flex; flex-direction:column; }
  .screen { display:none; flex-direction:column; height:100%; }
  .screen.active { display:flex; }

  .appbar { height:56px; background:var(--surface); border-bottom:1px solid var(--divider); display:flex; align-items:center; justify-content:space-between; padding:0 12px; flex-shrink:0; }
  .appbar h1 { font-size:1rem; font-weight:600; }
  .iconbtn { width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; font-size:0.9rem; color:var(--text); background:transparent; }
  .iconbtn:active { background:var(--surface-2); }

  .content { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }

  .landing { justify-content:center; padding:24px; }
  .landing h2 { font-size:1.75rem; margin-bottom:8px; }
  .landing p { color:var(--text-secondary); margin-bottom:24px; }
  .field { width:100%; padding:14px 12px; margin-bottom:12px; border:1px solid var(--divider); background:var(--surface); font-size:1rem; outline:none; }
  .field:focus { border-color:var(--accent); }
  .btn { width:100%; padding:14px 12px; font-size:1rem; font-weight:600; background:var(--accent); color:var(--accent-text); }
  .btn:active { opacity:0.9; }
  .btn.secondary { background:var(--surface-2); color:var(--text); border:1px solid var(--divider); }
  .btn.danger { background:var(--danger); color:#fff; }
  .btn.voice { background:var(--voice); color:#fff; }
  .btn-row { display:flex; gap:8px; }
  .btn-row .btn { flex:1; }

  .list-item { padding:14px 16px; border-bottom:1px solid var(--divider); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .list-item:hover { background:var(--bg); }
  .list-item.active { background:#FFF5F2; border-left:3px solid var(--accent); }
  .list-item .actions { display:flex; gap:6px; }
  .list-item .actions button { padding:4px 8px; font-size:0.75rem; background:var(--surface-2); border:1px solid var(--divider); }
  .meta { font-size:0.8rem; color:var(--text-secondary); }

  .file-label { display:inline-block; padding:10px 12px; border:1px dashed var(--divider); width:100%; text-align:center; color:var(--text-secondary); margin-bottom:12px; }

  #stageWrap { width:100%; height:32vh; max-height:300px; min-height:180px; position:relative; border-bottom:1px solid var(--divider); }
  #stageWrap canvas { display:block; width:100%; height:100%; }
  #stageLabel { position:absolute; bottom:8px; left:12px; right:12px; font-size:0.8rem; color:var(--text-secondary); pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .messages { flex:1; overflow-y:auto; padding:8px 0 16px; }
  .msg { width:100%; padding:10px 16px; display:flex; flex-direction:column; }
  .msg.own { align-items:flex-end; }
  .msg.other { align-items:flex-start; }
  .msg.agent { align-items:flex-start; background:#FAF8F5; border-bottom:1px solid var(--divider); }
  .msg-name { font-size:0.75rem; color:var(--text-secondary); margin-bottom:4px; }
  .msg-body { max-width:80%; padding:10px 12px; font-size:0.95rem; line-height:1.45; }
  .msg.own .msg-body { background:var(--surface-2); color:var(--text); }
  .msg.other .msg-body { background:var(--surface); border:1px solid var(--divider); }
  .msg.agent .msg-body { background:transparent; border:none; padding-left:0; }
  .sys { text-align:center; font-size:0.75rem; color:var(--text-secondary); padding:6px 16px; }

  .inputbar { border-top:1px solid var(--divider); background:var(--surface); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); flex-shrink:0; }
  .quick-chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; }
  .quick-chips button { flex-shrink:0; padding:6px 10px; font-size:0.85rem; background:var(--bg); border:1px solid var(--divider); color:var(--text); }
  .inputrow { display:flex; gap:8px; align-items:center; }
  .inputrow input { flex:1; padding:12px; font-size:16px; -webkit-tap-highlight-color:transparent; }
  .inputrow input { flex:1; padding:12px; border:1px solid var(--divider); background:var(--bg); font-size:1rem; outline:none; }
  .inputrow input:focus { border-color:var(--accent); }

  .sheet, .modal { position:fixed; inset:0; display:none; z-index:10; }
  .sheet.active, .modal.active { display:flex; }
  .sheet .backdrop, .modal .backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.35); }
  .sheet .panel { position:absolute; left:0; right:0; bottom:0; top:10vh; background:var(--surface); display:flex; flex-direction:column; transform:translateY(100%); transition:transform 0.25s ease; }
  .sheet.active .panel { transform:translateY(0); }
  .modal .panel { position:absolute; left:16px; right:16px; top:50%; transform:translateY(-50%) scale(0.96); opacity:0; background:var(--surface); padding:20px; border:1px solid var(--divider); max-height:84vh; overflow-y:auto; transition:transform 0.2s ease, opacity 0.2s ease; }
  .modal.active .panel { transform:translateY(-50%) scale(1); opacity:1; }
  .sheet-header { height:56px; border-bottom:1px solid var(--divider); display:flex; align-items:center; justify-content:space-between; padding:0 12px; }
  .tabs { display:flex; border-bottom:1px solid var(--divider); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tabs button { flex:0 0 auto; min-width:80px; padding:12px; font-size:0.9rem; font-weight:500; color:var(--text-secondary); border-bottom:2px solid transparent; background:none; }
  .tabs button.active { color:var(--accent); border-color:var(--accent); }
  .sheet-body { flex:1; overflow-y:auto; }

  .addrow { display:flex; gap:8px; padding:12px; border-bottom:1px solid var(--divider); }
  .addrow input, .addrow select { flex:1; padding:10px; border:1px solid var(--divider); background:var(--bg); }

  .setting-row { padding:12px 0; border-bottom:1px solid var(--divider); }
  .setting-row label { display:block; font-size:0.85rem; color:var(--text-secondary); margin-bottom:6px; }
  .setting-row .perms { display:flex; flex-wrap:wrap; gap:6px; }
  .setting-row .perms label { display:inline-flex; align-items:center; gap:4px; font-size:0.8rem; color:var(--text); margin:0; }

  .reaction-menu { position:fixed; background:var(--surface); border:1px solid var(--divider); display:flex; gap:4px; padding:4px; z-index:100; }
  .reaction-menu button { padding:6px 10px; font-size:0.85rem; background:var(--bg); border:1px solid var(--divider); }

  .voice-participants { display:flex; flex-wrap:wrap; gap:12px; padding:16px; justify-content:center; }
  .voice-participant { width:80px; text-align:center; }
  .voice-avatar { width:64px; height:64px; border-radius:50%; background:var(--surface-2); margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:0.75rem; }
  .voice-avatar.speaking { box-shadow:0 0 0 3px var(--voice); }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:4px; font-size:0.85rem; z-index:200; opacity:0; transition:opacity 0.3s; }
  .toast.show { opacity:1; }
  .bottomnav { display:flex; border-top:1px solid var(--divider); background:var(--surface); flex-shrink:0; }
  .bottomnav button { flex:1; padding:12px; font-size:0.85rem; color:var(--text-secondary); background:none; border-bottom:2px solid transparent; }
  .bottomnav button.active { color:var(--accent); border-color:var(--accent); font-weight:600; }

  @media (max-width: 480px) {
    .modal .panel { left:0; right:0; top:0; bottom:0; transform:none; max-height:100vh; padding:12px; border-radius:0; }
    .modal.active .panel { transform:none; }
  }

  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --divider:#3A3A3A; --text:#F2F2F2; --text-secondary:#A8A29E; }
    .msg.agent { background:#1A1816; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
  }
}
</script>
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <div id="landingScreen" class="screen active landing">
    <h2>FamiChibi</h2>
    <p>家族とAIアバターが一緒に過ごす、やさしい空間。</p>
    <button class="btn" onclick="window.showHosts()">はじめる</button>
  </div>

  <!-- HOSTS -->
  <div id="hostsScreen" class="screen">
    <div class="appbar">
      <h1>ホスト</h1>
      <button class="iconbtn" onclick="window.showAddHost()">追加</button>
    </div>
    <div class="content">
      <div id="hostList"></div>
      <div style="padding:16px;">
        <p class="meta">ホストは物理的なサーバーです。ホストを追加すると、その上にあるコミュニティサーバーを探せます。</p>
      </div>
    </div>
  </div>

  <!-- ADD HOST -->
  <div id="addHostScreen" class="screen">
    <div class="appbar">
      <h1>ホストを追加</h1>
      <button class="iconbtn" onclick="window.showHosts()">閉じる</button>
    </div>
    <div class="content" style="padding:16px;">
      <input id="addHostUrl" class="field" placeholder="URL (例: http://192.168.1.10:8000)" value="http://localhost:8000">
      <input id="addHostName" class="field" placeholder="表示名" value="My Host">
      <button class="btn" onclick="window.addHost()">追加</button>
      <button class="btn secondary" style="margin-top:8px;" onclick="window.scanLocal()">LAN検索</button>
      <div id="scanResults" style="margin-top:12px;"></div>
      <button class="btn secondary" style="margin-top:8px;" onclick="window.showHosts()">キャンセル</button>
    </div>
  </div>

  <!-- SERVERS -->
  <div id="serversScreen" class="screen">
    <div class="appbar">
      <button class="iconbtn" onclick="window.showHosts()">戻る</button>
      <h1 id="serversHostName">サーバー一覧</h1>
      <button class="iconbtn" onclick="window.showCreateServer()">追加</button>
    </div>
    <div class="content">
      <div id="serverList"></div>
    </div>
  </div>

  <!-- CREATE SERVER -->
  <div id="createServerScreen" class="screen">
    <div class="appbar">
      <h1>サーバー作成</h1>
      <button class="iconbtn" onclick="window.showServers()">閉じる</button>
    </div>
    <div class="content" style="padding:16px;">
      <input id="newServerName" class="field" placeholder="サーバー名">
      <input id="newServerPassword" class="field" placeholder="パスワード（空欄で公開）" type="password">
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:0.9rem;"><input type="checkbox" id="newServerInviteOnly"> 招待のみで参加可能にする</label>
      <input id="newServerOwnerName" class="field" placeholder="あなたの名前" value="Webユーザー">
      <button class="btn" onclick="window.createServer()">作成</button>
      <button class="btn secondary" style="margin-top:8px;" onclick="window.showServers()">キャンセル</button>
    </div>
  </div>

  <!-- CHANNELS -->
  <div id="channelsScreen" class="screen">
    <div class="appbar">
      <button class="iconbtn" onclick="window.showServers()">戻る</button>
      <div>
        <div id="channelsServerName" style="font-size:0.95rem;font-weight:600;">サーバー</div>
        <div class="meta" id="channelsServerMeta">0メンバー</div>
      </div>
      <button class="iconbtn" onclick="window.showServerSettings()" title="サーバー設定">歯車</button>
    </div>
    <div class="content">
      <div style="padding:12px 16px;">
        <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">テキストチャンネル</div>
        <div id="textChannelList"></div>
      </div>
      <div style="padding:12px 16px;">
        <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:8px;">ボイスチャンネル</div>
        <div id="voiceChannelList"></div>
      </div>
    </div>
  </div>

  <!-- CREATE/EDIT CHANNEL -->
  <div id="createChannelScreen" class="screen">
    <div class="appbar">
      <h1 id="createChannelTitle">チャンネル作成</h1>
      <button class="iconbtn" onclick="window.showChannels()">閉じる</button>
    </div>
    <div class="content" style="padding:16px;">
      <input id="newChannelName" class="field" placeholder="チャンネル名">
      <select id="newChannelType" class="field">
        <option value="text">テキスト</option>
        <option value="voice">ボイス</option>
      </select>
      <select id="newChannelVisibility" class="field">
        <option value="public">公開</option>
        <option value="private">非公開（招待制）</option>
      </select>
      <input id="newChannelPassword" class="field" placeholder="入室パスワード（空欄でなし）" type="password">
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:0.9rem;"><input type="checkbox" id="newChannelAi"> AI応答を有効にする</label>
      <button class="btn" id="createChannelBtn" onclick="window.createChannel()">作成</button>
      <button class="btn secondary" style="margin-top:8px;" onclick="window.showChannels()">キャンセル</button>
    </div>
  </div>

  <!-- TEXT CHAT -->
  <div id="chatScreen" class="screen">
    <div class="appbar">
      <button class="iconbtn" onclick="window.leaveChannel()">戻る</button>
      <div>
        <div id="chatChannelTitle" style="font-size:0.95rem;font-weight:600;">チャンネル</div>
        <div class="meta" id="chatMeta">0人在室</div>
      </div>
      <button class="iconbtn" onclick="window.leaveChannel()" title="退出">退出</button>
    </div>
    <div id="stageWrap">
      <canvas id="vrmCanvas"></canvas>
      <div id="stageLabel">VRM: デフォルト</div>
    </div>
    <div id="messages" class="messages"></div>
    <div class="inputbar">
      <div class="quick-chips" id="quickChips"></div>
      <div class="inputrow">
        <button id="micBtn" class="iconbtn" onclick="window.toggleMic()" title="音声入力" style="font-size:0.75rem;">音声</button>
        <input id="messageInput" placeholder="メッセージ…" onkeydown="if(event.key==='Enter') window.sendMessage()">
        <button class="iconbtn" onclick="window.sendMessage()" title="送信" style="background:var(--accent);color:#fff;">送信</button>
      </div>
    </div>
    <div class="bottomnav">
      <button class="active" onclick="window.switchChatTab('chat')">メッセージ</button>
      <button onclick="window.showNotebook()">ノート</button>
      <button onclick="window.showProfile()">プロフィール</button>
    </div>
  </div>

  <!-- VOICE CHANNEL -->
  <div id="voiceScreen" class="screen">
    <div class="appbar">
      <button class="iconbtn" onclick="window.leaveVoice()">戻る</button>
      <div>
        <div id="voiceChannelTitle" style="font-size:0.95rem;font-weight:600;">ボイスチャンネル</div>
        <div class="meta" id="voiceMeta">0人在室</div>
      </div>
      <button class="iconbtn" onclick="window.toggleMute()" id="muteBtn">ミュート</button>
    </div>
    <div class="content">
      <div class="voice-participants" id="voiceParticipants"></div>
      <div style="padding:16px;text-align:center;">
        <button class="btn danger" style="max-width:200px;" onclick="window.leaveVoice()">退出</button>
      </div>
    </div>
  </div>

</div>

<!-- NOTEBOOK SHEET -->
<div id="notebookSheet" class="sheet">
  <div class="backdrop" onclick="window.hideNotebook()"></div>
  <div class="panel">
    <div class="sheet-header">
      <h2>家族ノート</h2>
      <button class="iconbtn" onclick="window.hideNotebook()">閉じる</button>
    </div>
    <div class="tabs">
      <button class="active" data-tab="notes" onclick="window.setTab('notes')">メモ</button>
      <button data-tab="tasks" onclick="window.setTab('tasks')">お手伝い</button>
      <button data-tab="events" onclick="window.setTab('events')">予定</button>
      <button data-tab="photos" onclick="window.setTab('photos')">写真</button>
    </div>
    <div class="sheet-body" id="notebookBody"></div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal">
  <div class="backdrop" onclick="window.hideProfile()"></div>
  <div class="panel">
    <div class="sheet-header" style="padding:0 0 12px;">
      <h2>プロフィール</h2>
      <button class="iconbtn" onclick="window.hideProfile()">閉じる</button>
    </div>
    <div class="setting-row">
      <label>このサーバーでの名前</label>
      <input id="profileName" class="field" placeholder="名前">
    </div>
    <div class="setting-row">
      <label>VRMアバター</label>
      <span id="profileVrmName" style="font-size:0.85rem;color:var(--text-secondary);">デフォルト</span>
      <label class="file-label" style="margin-top:8px;">
        <input type="file" id="profileVrmInput" accept=".vrm" style="display:none;" onchange="window.onProfileVrmSelected(event)">
        VRMファイルを選択
      </label>
    </div>
    <div class="setting-row">
      <label>クイック返信（カンマ区切り）</label>
      <input id="profileQuick" class="field" placeholder="おはよう,ただいま,おかえり,ありがとう">
    </div>
    <div class="setting-row">
      <label>VOICEVOX 話者</label>
      <select id="profileSpeaker" class="field">
        <option value="58">58: 猫使ビィ</option>
        <option value="3">3: ずんだもん</option>
        <option value="2">2: 四国めたん</option>
        <option value="8">8: 春日部つむぎ</option>
        <option value="10">10: 雨晴はう</option>
        <option value="14">14: 冥鳴ひまり</option>
      </select>
    </div>
    <div class="setting-row" style="display:flex;gap:12px;align-items:center;justify-content:space-between;">
      <span>アバター音声（TTS）</span>
      <input type="checkbox" id="profileTts" style="width:20px;height:20px;">
    </div>
    <div class="setting-row" style="display:flex;gap:12px;align-items:center;justify-content:space-between;">
      <span>おやすみモード</span>
      <input type="checkbox" id="profileQuiet" style="width:20px;height:20px;">
    </div>
    <button class="btn" style="margin-top:8px;" onclick="window.saveProfile()">保存</button>
    <button class="btn secondary" style="margin-top:8px;" onclick="window.hideProfile()">閉じる</button>
  </div>
</div>

<!-- SERVER SETTINGS MODAL -->
<div id="serverSettingsModal" class="modal">
  <div class="backdrop" onclick="window.hideServerSettings()"></div>
  <div class="panel">
    <div class="sheet-header" style="padding:0 0 12px;">
      <h2>サーバー設定</h2>
      <button class="iconbtn" onclick="window.hideServerSettings()">閉じる</button>
    </div>
    <div class="tabs">
      <button class="active" data-tab="overview" onclick="window.setSettingTab('overview')">概要</button>
      <button data-tab="members" onclick="window.setSettingTab('members')">メンバー</button>
      <button data-tab="roles" onclick="window.setSettingTab('roles')">役割</button>
      <button data-tab="invites" onclick="window.setSettingTab('invites')">招待</button>
      <button data-tab="bots" onclick="window.setSettingTab('bots')">AI</button>
      <button data-tab="knowledge" onclick="window.setSettingTab('knowledge')">知識</button>
    </div>
    <div class="sheet-body" id="serverSettingsBody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// --- State ---
let hosts = JSON.parse(localStorage.getItem('famichibi_hosts') || '[]');
let activeHost = null;
let activeServer = null;
let activeChannel = null;
let myId = localStorage.getItem('famichibi_my_id') || ('web_' + Math.random().toString(36).substr(2,9));
localStorage.setItem('famichibi_my_id', myId);

let ws = null;
let peerConnections = {};
let localStream = null;
let isMuted = false;
let currentTab = 'notes';
let currentSettingTab = 'overview';
let voicePollInterval = null;
let serverSettingsCache = null;

function $(id){ return document.getElementById(id); }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function API(){ return activeHost ? activeHost.url : location.origin; }
function serverPath(){ return activeServer ? `/s/${activeServer.id}` : ''; }
function authQuery(){ return `user_id=${encodeURIComponent(myId)}&user_name=${encodeURIComponent(getProfile().name)}`; }

function getProfile(){
  const key = `profile_${activeServer?.id||'default'}_${activeHost?.id||'local'}`;
  const raw = localStorage.getItem(key);
  return raw ? JSON.parse(raw) : {name:'Webユーザー', vrmUrl:'', quick:'おはよう,ただいま,おかえり,ありがとう,がんばって', speaker:58, tts:false, quiet:false};
}
function setProfile(p){ localStorage.setItem(`profile_${activeServer?.id||'default'}_${activeHost?.id||'local'}`, JSON.stringify(p)); }

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

async function apiFetch(path, options={}){
  const sep = path.includes('?') ? '&' : '?';
  const url = API() + path + sep + authQuery();
  try{
    const res = await fetch(url, options);
    if(!res.ok){
      const text = await res.text();
      try{ const j=JSON.parse(text); if(j.detail||j.error) toast(j.detail||j.error); }catch(e){ toast('エラー: '+res.status); }
      throw new Error(res.statusText);
    }
    return res;
  }catch(e){ throw e; }

// --- Three.js ---
const stage = $('stageWrap');
const canvas = $('vrmCanvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, stage.clientWidth/stage.clientHeight, 0.1, 100);
camera.position.set(0,1.3,1.5); camera.lookAt(0,1.1,0);
const renderer = new THREE.WebGLRenderer({canvas, alpha:true, antialias:true, premultipliedAlpha:false});
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x000000,0);
scene.add(new THREE.AmbientLight(0xffffff,1.0));
const keyL = new THREE.DirectionalLight(0xffffff,1.2); keyL.position.set(1,1,1); scene.add(keyL);
const back = new THREE.DirectionalLight(0xffffff,0.5); back.position.set(-1,0.5,-1); scene.add(back);

let vrm=null, clock=new THREE.Clock(), currentExpression='neutral', blinkTimer=0, isBlinking=false;
function loadVrm(url){
  if(!url) url='/static/avatars/AvatarSample_M.vrm';
  $('stageLabel').textContent = 'VRM: ' + (url.split('/').pop()||'デフォルト');
  const loader=new GLTFLoader();
  loader.register(parser=>new VRMLoaderPlugin(parser));
  loader.load(url, (gltf)=>{
    try{
      if(vrm){ scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
      vrm=gltf.userData.vrm; if(!vrm) return;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      scene.add(vrm.scene); vrm.scene.position.set(0,0,0); vrm.scene.rotation.set(0,0,0); vrm.scene.scale.set(1,1,1);
      if(vrm.expressionManager){ vrm.expressionManager.setValue('neutral',1.0); currentExpression='neutral'; }
    }catch(e){ console.error(e); }
  }, undefined, (err)=>{ console.error('VRM load error', err); });
}
function setExpression(name,value=1.0){
  if(!vrm||!vrm.expressionManager) return;
  try{
    if(currentExpression && currentExpression!==name) vrm.expressionManager.setValue(currentExpression,0.0);
    vrm.expressionManager.setValue(name,value); currentExpression=name;
  }catch(e){}
}
function resetExpression(){ setExpression('neutral',1.0); }
function updateBlink(delta){
  if(!vrm||!vrm.expressionManager) return;
  blinkTimer-=delta;
  if(blinkTimer<=0){
    if(isBlinking){ vrm.expressionManager.setValue('blink',0.0); isBlinking=false; blinkTimer=2+Math.random()*4; }
    else { vrm.expressionManager.setValue('blink',1.0); isBlinking=true; blinkTimer=0.15; }
  }
}
function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();
  if(vrm){ vrm.update(delta); updateBlink(delta); }
  renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{
  const w=stage.clientWidth, h=stage.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
});

window.scanLocal = async function(){
  const results=$('scanResults');
  results.textContent='検索中...';
  const found=[];
  const bases=['192.168.1.','192.168.0.','10.0.0.'];
  const ips=[];
  for(const base of bases) for(let i=1;i<=254;i++) ips.push(base+i);
  const check = async (ip)=>{
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),900);
      const res=await fetch(`http://${ip}:8000/discover`, {mode:'cors', signal:ctrl.signal});
      clearTimeout(t);
      if(res.ok){
        const data=await res.json();
        return {url:`http://${ip}:8000`, name:data.name||'FamiChibi'};
      }
    }catch(e){}
    return null;
  };
  const batch=64;
  for(let i=0;i<ips.length;i+=batch){
    const slice=ips.slice(i,i+batch);
    const batchResults=await Promise.all(slice.map(check));
    batchResults.forEach(r=>{ if(r) found.push(r); });
    results.textContent=`検索中... ${Math.min(i+batch,ips.length)}/${ips.length}`;
  }
  if(!found.length){ results.textContent='見つかりませんでした'; return; }
  results.innerHTML=found.map(s=>`<div class="list-item" onclick="window.addFoundHost('${esc(s.url)}','${esc(s.name)}')" style="margin-top:4px;">
    <div><div style="font-weight:600;">${esc(s.name)}</div><div class="meta">${esc(s.url)}</div></div>
  </div>`).join('');
};

  showHosts();
};

function handleMsg(m){
  if(m.type==='system'){
    addSys(m.content);
  } else if(m.type==='chat' || m.type==='agent'){
    addMsg(m);
    const profile=getProfile();
    if(m.type==='agent' && profile.tts && !isQuietHours()) speak(m.content);
    if(m.type==='agent'){ setExpression('happy',1.0); setTimeout(resetExpression,1500); }
  } else if(m.type==='whisper'){
    addMsg({sender:m.from_user_name+'（ささやき）', sender_id:m.from_user_id, content:m.content, type:'whisper'});
  } else if(m.type==='nudge'){
    nudgeScreen();
    addSys(m.from_user_name + 'さんがあなたを呼んでいます');
  } else if(m.type==='reaction'){
    addReactionToMessage(m.target_id, m.reaction);
  } else if(m.type==='voice_signal'){
    handleVoiceSignalData(m.data);
  }
}

// Voice
function isQuietHours(){
  const profile=getProfile();
  if(!profile.quiet) return false;
  const h=new Date().getHours();
  return h>=0 && h<7;
}

function speak(text){
  if(!window.speechSynthesis) return;
  const profile=getProfile();
  if(profile.speaker){
    const fd = new FormData();
    fd.append('text', text); fd.append('speaker', profile.speaker);
    fetch(API()+'/voicevox/synthesize',{method:'POST',body:fd})
      .then(r=>r.ok?r.blob():null)
      .then(blob=>{
        if(!blob) return fallbackTTS(text);
        const url = URL.createObjectURL(blob);
        const a = new Audio(url);
        a.play().catch(()=>fallbackTTS(text));
      }).catch(()=>fallbackTTS(text));
  } else { fallbackTTS(text); }
}

function fallbackTTS(text){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=1.05;
  window.speechSynthesis.speak(u);
}

  const rec = new webkitSpeechRecognition();
  rec.lang='ja-JP'; rec.interimResults=false; rec.continuous=false;
  btn.style.background='#FBE9E8';
  rec.onend = ()=>{ btn.style.background=''; };
  rec.onresult = (e)=>{
    const t=e.results[0][0].transcript;
    $('messageInput').value = ($('messageInput').value+' '+t).trim();
    window.sendMessage();
  };
  rec.onerror = ()=> btn.style.background='';
  rec.start();
};

// WebRTC Voice (server-polling + REST signaling)
async function joinVoice(cid, password){
  activeChannel={id:cid,name:activeChannel?.name||'Voice',type:'voice'};
  show('voiceScreen');
  $('voiceChannelTitle').textContent = activeChannel.name;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio:true, video:false});
    const profile=getProfile();
    const fd=new FormData(); if(password) fd.append('password',password);
    const res = await apiFetch(serverPath()+'/channels/'+cid+'/voice/join',{method:'POST',body:fd});
    const data = await res.json();
    updateVoiceParticipants(data.users);
    // Start polling for voice signals
    startVoicePoll(cid);
    // Create offers to existing users
    (data.users||[]).forEach(u=>{ if(u.user_id!==myId) createPeerConnection(u.user_id, true); });
  }catch(e){ alert('ボイスチャンネルに参加できません: '+e.message); showChannels(); }
}

function startVoicePoll(cid){
  if(voicePollInterval) clearInterval(voicePollInterval);
  voicePollInterval = setInterval(async ()=>{
    try{
      const signal = await (await apiFetch(serverPath()+'/channels/'+cid+'/voice/poll')).json();
      if(signal && signal.type) handleVoiceSignalData(signal);
    }catch(e){}
  }, 1000);
}

function handleVoiceSignalData(s){
  if(!s || !s.type) return;
  if(s.type==='offer') handleOffer(s.from, s.sdp);
  else if(s.type==='answer') handleAnswer(s.from, s.sdp);
  else if(s.type==='ice') handleIce(s.from, s.candidate, s.sdp_mid, s.sdp_mline_index);
}

async function createPeerConnection(pid, isInitiator){
  if(peerConnections[pid]) return;
  const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  peerConnections[pid] = pc;
  localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
  pc.ontrack = (e)=>{
    let audio = document.getElementById('audio-'+pid);
    if(!audio){ audio = document.createElement('audio'); audio.id='audio-'+pid; audio.autoplay=true; document.body.appendChild(audio); }
    audio.srcObject = e.streams[0];
  };
  pc.onicecandidate = async (e)=>{
    if(e.candidate){
      const fd=new FormData();
      fd.append('target_user_id',pid); fd.append('candidate',e.candidate.candidate); fd.append('sdp_mid',e.candidate.sdpMid||''); fd.append('sdp_mline_index',e.candidate.sdpMLineIndex||0);
      await apiFetch(serverPath()+'/channels/'+activeChannel.id+'/voice/ice',{method:'POST',body:fd});
    }
  };
  if(isInitiator){
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const fd=new FormData(); fd.append('target_user_id',pid); fd.append('sdp',offer.sdp);
    await apiFetch(serverPath()+'/channels/'+activeChannel.id+'/voice/offer',{method:'POST',body:fd});
  }
}

async function handleOffer(pid, sdp){
  const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  peerConnections[pid] = pc;
  localStream.getTracks().forEach(t=>pc.addTrack(t, localStream));
  pc.ontrack = (e)=>{
    let audio = document.getElementById('audio-'+pid);
    if(!audio){ audio = document.createElement('audio'); audio.id='audio-'+pid; audio.autoplay=true; document.body.appendChild(audio); }
    audio.srcObject = e.streams[0];
  };
  pc.onicecandidate = async (e)=>{
    if(e.candidate){
      const fd=new FormData();
      fd.append('target_user_id',pid); fd.append('candidate',e.candidate.candidate); fd.append('sdp_mid',e.candidate.sdpMid||''); fd.append('sdp_mline_index',e.candidate.sdpMLineIndex||0);
      await apiFetch(serverPath()+'/channels/'+activeChannel.id+'/voice/ice',{method:'POST',body:fd});
    }
  };
  await pc.setRemoteDescription(new RTCSessionDescription({type:'offer', sdp}));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  const fd=new FormData(); fd.append('target_user_id',pid); fd.append('sdp',answer.sdp);
  await apiFetch(serverPath()+'/channels/'+activeChannel.id+'/voice/answer',{method:'POST',body:fd});
}

async function handleAnswer(pid, sdp){
  const pc = peerConnections[pid];
  if(pc) await pc.setRemoteDescription(new RTCSessionDescription({type:'answer', sdp}));
}

async function handleIce(pid, candidate, sdpMid, sdpMLineIndex){
  const pc = peerConnections[pid];
  if(pc && candidate){
    try{ await pc.addIceCandidate(new RTCIceCandidate({candidate, sdpMid, sdpMLineIndex})); }catch(e){}
  }
}

function updateVoiceParticipants(users){
  const el=$('voiceParticipants');
  if(!el) return;
  const list = users||[];
  el.innerHTML = list.map(u=>`<div class="voice-participant" id="vp-${esc(u.user_id)}">

    <div style="font-size:0.8rem;">${esc(u.user_name||'')}</div>

window.toggleMute = function(){
  isMuted = !isMuted;
  if(localStream){ localStream.getAudioTracks().forEach(t=>t.enabled=!isMuted); }
  $('muteBtn').textContent = isMuted ? 'ミュート解除' : 'ミュート';
};

window.leaveVoice = async function(){
  if(voicePollInterval){ clearInterval(voicePollInterval); voicePollInterval=null; }
  if(ws){ ws.close(); ws=null; }
  if(activeChannel){
    try{ await apiFetch(serverPath()+'/channels/'+activeChannel.id+'/voice/leave',{method:'POST'}); }catch(e){}
  }
  Object.values(peerConnections).forEach(pc=>pc.close());
  peerConnections={};
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  document.querySelectorAll('audio[id^="audio-"]').forEach(a=>a.remove());
  activeChannel=null;
  showChannels();
};

async function loadNotebook(){
  if(!activeChannel || activeChannel.type!=='text' || !activeServer) return;
  try{
    const [notes, tasks, events, photos] = await Promise.all([
      apiFetch(serverPath()+'/channels/'+activeChannel.id+'/notes').then(r=>r.json()),
      apiFetch(serverPath()+'/channels/'+activeChannel.id+'/tasks').then(r=>r.json()),
      apiFetch(serverPath()+'/channels/'+activeChannel.id+'/events').then(r=>r.json()),
      apiFetch(serverPath()+'/channels/'+activeChannel.id+'/photos').then(r=>r.json())
    ]);
    window._notebook = {notes, tasks, events, photos};
    renderNotebook();
  }catch(e){}
}
window.loadNotebook = loadNotebook;

function renderNotebook(){
  const body=$('notebookBody');
  const data=window._notebook||{notes:[],tasks:[],events:[],photos:[]};
  if(currentTab==='notes') renderNotes(data.notes);
  else if(currentTab==='tasks') renderTasks(data.tasks);
  else if(currentTab==='events') renderEvents(data.events);
  else renderPhotos(data.photos);
}

      <div class="perms">${allPerms.map(p=>`<label><input type="checkbox" ${perms.includes(p)||perms.includes('*')?'checked':''} onchange="window.toggleRolePerm('${esc(name)}','${p}',this.checked)" ${isOwner?'':'disabled'}> ${esc(p)}</label>`).join('')}</div>

window.toggleRolePerm = async function(role,perm,checked){
  const res=await apiFetch(serverPath()+'/roles/'+role,{method:'PUT',body:new URLSearchParams({permissions:'dummy'})});
  // We need current perms; refetch roles
  const roles=await (await apiFetch(serverPath()+'/roles')).json();
  const perms=new Set((roles[role]?.permissions||[]).filter(p=>p!=='*'));
  if(checked) perms.add(perm); else perms.delete(perm);
  await apiFetch(serverPath()+'/roles/'+role,{method:'PUT',body:new URLSearchParams({permissions:Array.from(perms).join(',')})});
  renderServerSettings();
};

function renderInvites(invites){
  const canManage = activeServer?.permissions?.includes('manage_invites') || activeServer?.my_role==='owner';
  const channels = activeServer?.channels || [];
  let html=[`<div style="padding:12px;">
    <select id="inviteChannel" class="field" style="margin-bottom:8px;"><option value="">サーバー全体</option>${channels.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select>
    <button class="btn" onclick="window.createInvite()">招待リンクを作成</button>
  </div>`];
  invites.forEach(i=>{
    const link = location.origin + '/invites/' + i.code;
    const qr = '/invites/' + i.code + '/qr';
    html.push(`<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:8px;">
      <div style="font-weight:600;">${esc(i.code)}</div>
      <div class="meta">${i.channel_id?'チャンネル招待':'サーバー招待'} · 使用回数 ${i.uses}/${i.max_uses||'無制限'} · ${i.expires_at?'期限:'+new Date(i.expires_at).toLocaleString():'期限なし'}</div>
      <img src="${qr}" style="width:160px;height:160px;background:#fff;border-radius:8px;" alt="QR">
      <div class="actions"><button onclick="navigator.clipboard.writeText('${link}');toast('コピーしました')">リンクをコピー</button>${canManage?`<button onclick="window.deleteInvite('${esc(i.code)}')">削除</button>`:''}</div>
    </div>`);
  });
  $('serverSettingsBody').innerHTML=html.join('');
}
window.createInvite = async function(){
  const fd = new FormData();
  const channelId = $('inviteChannel')?.value;
  if (channelId) fd.append('channel_id', channelId);
  await apiFetch(serverPath()+'/invites',{method:'POST',body:fd});
  renderServerSettings();
};
window.deleteInvite = async function(code){ await apiFetch(serverPath()+'/invites/'+code,{method:'DELETE'}); renderServerSettings(); };

function renderBots(bots){
  const canManage = activeServer?.permissions?.includes('manage_bots') || activeServer?.my_role==='owner';
  const channels = activeServer?.channels || [];
  let html=[`<div class="addrow" style="flex-wrap:wrap;">
    <input id="newBotName" placeholder="ボット名" style="min-width:120px;flex:1;">
    <select id="newBotPersonality" style="min-width:120px;flex:1;"><option value="やさしい">やさしい</option><option value="元気">元気</option><option value="クール">クール</option><option value="おもしろ">おもしろ</option><option value="厳格">厳格</option></select>
    <button onclick="window.createBot()">追加</button>
  </div>`];
  bots.forEach(b=>{
    const channelOptions = channels.map(c=>`<option value="${esc(c.id)}" ${(b.channels||[]).includes(c.id)?'selected':''}>${esc(c.name)}</option>`).join('');
    html.push(`<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:8px;padding:12px;">
      <div style="font-weight:600;">${esc(b.name)}</div>
      <div class="meta">性格: ${esc(b.personality)} · モデル: ${esc(b.model||'デフォルト')} · TTS:${b.voice_enabled?'ON':'OFF'} · 自発:${b.proactive_enabled?'ON':'OFF'}</div>
      ${canManage?`<div style="width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px;">
        <div class="addrow"><input id="botName_${esc(b.id)}" value="${esc(b.name)}" placeholder="名前" style="flex:1;"><input id="botModel_${esc(b.id)}" value="${esc(b.model||'')}" placeholder="モデル名" style="flex:1;"></div>
        <select id="botPersonality_${esc(b.id)}" style="width:100%;padding:8px;"><option value="やさしい" ${b.personality==='やさしい'?'selected':''}>やさしい</option><option value="元気" ${b.personality==='元気'?'selected':''}>元気</option><option value="クール" ${b.personality==='クール'?'selected':''}>クール</option><option value="おもしろ" ${b.personality==='おもしろ'?'selected':''}>おもしろ</option><option value="厳格" ${b.personality==='厳格'?'selected':''}>厳格</option></select>
        <textarea id="botSystem_${esc(b.id)}" placeholder="system prompt" style="width:100%;min-height:60px;padding:8px;border-radius:6px;border:1px solid var(--outline);">${esc(b.system_prompt||'')}</textarea>
        <div class="addrow"><input id="botTemp_${esc(b.id)}" type="number" step="0.1" min="0" max="2" value="${b.temperature??0.7}" placeholder="temperature" style="flex:1;">
        <label style="display:flex;align-items:center;gap:4px;font-size:0.85rem;"><input type="checkbox" id="botVoice_${esc(b.id)}" ${b.voice_enabled?'checked':''}> 音声</label>
        <label style="display:flex;align-items:center;gap:4px;font-size:0.85rem;"><input type="checkbox" id="botProactive_${esc(b.id)}" ${b.proactive_enabled?'checked':''}> 自発</label></div>
        <label style="font-size:0.85rem;">有効チャンネル（空欄ですべて）<select id="botChannels_${esc(b.id)}" multiple style="width:100%;min-height:60px;">${channelOptions}</select></label>
        <div class="actions"><button onclick="window.saveBot('${esc(b.id)}')">保存</button><button onclick="window.deleteBot('${esc(b.id)}')">削除</button></div>
      </div>`:''}
    </div>`);
  });
  $('serverSettingsBody').innerHTML=html.join('');
}
window.createBot = async function(){
  const name=$('newBotName').value.trim(); if(!name) return;
  await apiFetch(serverPath()+'/bots',{method:'POST',body:new URLSearchParams({name,personality:$('newBotPersonality').value,proactive_enabled:'false'})});
  renderServerSettings();
};
window.saveBot = async function(bid){
  const channels = Array.from($('botChannels_'+bid).selectedOptions).map(o=>o.value).join(',');
  await apiFetch(serverPath()+'/bots/'+bid,{method:'PUT',body:new URLSearchParams({
    name:$('botName_'+bid).value.trim(),
    personality:$('botPersonality_'+bid).value,
    model:$('botModel_'+bid).value,
    system_prompt:$('botSystem_'+bid).value,
    temperature:$('botTemp_'+bid).value,
    voice_enabled:$('botVoice_'+bid).checked?'true':'false',
    proactive_enabled:$('botProactive_'+bid).checked?'true':'false',
    channels:channels
  })});
  renderServerSettings();
};
window.deleteBot = async function(bid){ if(!confirm('削除しますか？')) return; await apiFetch(serverPath()+'/bots/'+bid,{method:'DELETE'}); renderServerSettings(); };

function renderKnowledge(knowledge){
  const canManage = activeServer?.permissions?.includes('manage_bots') || activeServer?.my_role==='owner';
  let html=[`<div class="addrow"><input id="newKnowTitle" placeholder="タイトル"><input id="newKnowContent" placeholder="内容"><button onclick="window.addKnowledge()">追加</button></div>`];
  knowledge.forEach(k=>{
    html.push(`<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:6px;">
      <div style="font-weight:600;">${esc(k.title)}</div>
      <div style="font-size:0.9rem;">${esc(k.content)}</div>
      ${canManage?`<div class="actions"><button onclick="window.editKnowledge('${esc(k.id)}')">編集</button><button onclick="window.deleteKnowledge('${esc(k.id)}')">削除</button></div>`:''}
    </div>`);
  });
  $('serverSettingsBody').innerHTML=html.join('');
}
window.addKnowledge = async function(){
  const title=$('newKnowTitle').value.trim(); const content=$('newKnowContent').value.trim(); if(!title||!content) return;
  await apiFetch(serverPath()+'/knowledge',{method:'POST',body:new URLSearchParams({title,content})});
  renderServerSettings();
};
window.editKnowledge = async function(kid){
  const title=prompt('タイトル'); if(title===null) return;
  const content=prompt('内容'); if(content===null) return;
  await apiFetch(serverPath()+'/knowledge/'+kid,{method:'PUT',body:new URLSearchParams({title,content})});
  renderServerSettings();
};
window.deleteKnowledge = async function(kid){ if(!confirm('削除しますか？')) return; await apiFetch(serverPath()+'/knowledge/'+kid,{method:'DELETE'}); renderServerSettings(); };

window.onload = async function(){
  const params = new URLSearchParams(location.search);
  const invite = params.get('invite');
  const serverId = params.get('server');
  const channelId = params.get('channel');
  if (!invite && !serverId) return;
  activeHost = {id:'url_host', name:'URL Host', url: location.origin.replace(/\/$/, '')};
  try {
    if (invite) {
      const res = await apiFetch('/invites/'+invite+'/join', {method:'POST', body: new URLSearchParams({user_id: myId, user_name: getProfile().name})});
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      activeServer = {id: data.server_id, name: data.server_name};
      if (data.channel_id) { activeChannel={id:data.channel_id, name:'招待チャンネル'}; await connectWs(data.channel_id, ''); }
      else { showChannels(); }
      return;
    }
    if (serverId) {
      activeServer = {id: serverId};
      const info = await (await apiFetch(serverPath())).json();
      activeServer.name = info.name;
      activeServer.my_role = info.my_role;
      activeServer.permissions = info.permissions || [];
      activeServer.channels = info.channels || [];
      if (channelId) {
        const ch = info.channels?.find(c=>c.id===channelId);
        activeChannel={id:channelId, name: ch?.name||'チャンネル'};
        if (ch?.type==='voice') { await joinVoice(channelId, ''); }
        else { await connectWs(channelId, ''); }
      } else { showChannels(); }
    }
  } catch(e){ alert('自動参加に失敗しました'); }
};
