<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamiChibi Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; }
        .header { background: #e94560; color: #fff; padding: 16px; text-align: center; }
        .header h1 { font-size: 1.2rem; }
        .screen { display: none; padding: 16px; }
        .screen.active { display: block; }
        input, button { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        button { background: #e94560; color: #fff; border: none; cursor: pointer; }
        button.secondary { background: #eee; color: #333; }
        .room-item { padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .room-item:hover { background: #fafafa; }
        .room-item .lock { color: #888; }
        .messages { height: 60vh; overflow-y: auto; padding: 8px 0; }
        .msg { margin-bottom: 10px; }
        .msg-name { font-size: 0.75rem; color: #888; margin-bottom: 2px; }
        .msg-body { display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 80%; word-break: break-word; font-size: 0.95rem; }
        .msg.own { text-align: right; }
        .msg.own .msg-body { background: #e94560; color: #fff; }
        .msg.other .msg-body { background: #eee; }
        .msg.agent .msg-body { background: #667eea; color: #fff; }
        .chat-input { display: flex; gap: 8px; padding-top: 8px; border-top: 1px solid #eee; }
        .chat-input input { flex: 1; margin-bottom: 0; }
        .chat-input button { width: auto; padding: 12px 16px; margin-bottom: 0; }
        .users { font-size: 0.8rem; color: #666; margin-bottom: 8px; }
        .empty { text-align: center; color: #888; padding: 40px 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>💬 FamiChibi Chat</h1></div>

        <div id="roomListScreen" class="screen active">
            <input id="userNameInput" placeholder="あなたの名前" value="Webユーザー">
            <div id="roomList"><div class="empty">読み込み中...</div></div>
            <button onclick="showCreateRoom()">＋ 部屋を作る</button>
            <button class="secondary" onclick="refreshRooms()">🔄 更新</button>
        </div>

        <div id="createRoomScreen" class="screen">
            <h3>部屋を作成</h3>
            <input id="newRoomName" placeholder="部屋の名前">
            <input id="newRoomPassword" placeholder="パスワード（空欄で公開）" type="password">
            <button onclick="createRoom()">作成</button>
            <button class="secondary" onclick="showRoomList()">キャンセル</button>
        </div>

        <div id="joinRoomScreen" class="screen">
            <h3 id="joinRoomTitle">部屋に参加</h3>
            <input id="joinPassword" placeholder="パスワード" type="password">
            <button onclick="joinRoom()">参加</button>
            <button class="secondary" onclick="showRoomList()">キャンセル</button>
        </div>

        <div id="chatScreen" class="screen">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                <b id="chatRoomTitle">部屋名</b>
                <span class="users" id="chatUserCount">0人在室</span>
            </div>
            <div class="users" id="chatUsers"></div>
            <div class="messages" id="messages"></div>
            <div class="chat-input">
                <input id="messageInput" placeholder="メッセージ..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">送信</button>
            </div>
            <button class="secondary" onclick="leaveRoom()" style="margin-top:8px;">← 退出する</button>
        </div>
    </div>

<script>
const API = location.origin;
let roomId = null, roomName = '', ws = null;
let myId = 'web_' + Math.random().toString(36).substr(2, 9);
let myName = '';
let joiningRoom = null;

function $(id) { return document.getElementById(id); }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); }
function showRoomList() { show('roomListScreen'); refreshRooms(); }
function showCreateRoom() { show('createRoomScreen'); }
function showJoinRoom(rid, rname, hasPw) {
    joiningRoom = {id: rid, name: rname};
    if (!hasPw) { joinRoom(); return; }
    $('joinRoomTitle').textContent = rname + 'に参加';
    $('joinPassword').value = '';
    show('joinRoomScreen');
}

async function refreshRooms() {
    try {
        const rooms = await (await fetch(API + '/rooms')).json();
        $('roomList').innerHTML = rooms.length ? rooms.map(r =>
            `<div class="room-item" onclick="showJoinRoom('${r.id}', '${r.name}', ${r.has_password})">
                <span>${r.name}</span>
                <span class="lock">${r.has_password ? '🔒' : ''} ${r.user_count}人</span>
            </div>`
        ).join('') : '<div class="empty">部屋がありません</div>';
    } catch { $('roomList').innerHTML = '<div class="empty">接続できません</div>'; }
}

async function createRoom() {
    const name = $('newRoomName').value.trim();
    if (!name) return alert('名前を入力してください');
    const fd = new FormData();
    fd.append('name', name);
    fd.append('password', $('newRoomPassword').value);
    try {
        const res = await (await fetch(API + '/rooms', {method:'POST', body:fd})).json();
        if (res.error) return alert(res.error);
        joiningRoom = {id: res.room_id, name: name};
        joinRoom();
    } catch { alert('作成に失敗しました'); }
}

async function joinRoom() {
    myName = $('userNameInput').value.trim() || 'Webユーザー';
    const fd = new FormData();
    fd.append('user_id', myId);
    fd.append('user_name', myName);
    fd.append('password', $('joinPassword').value || '');
    try {
        const res = await (await fetch(API + '/rooms/' + joiningRoom.id + '/join', {method:'POST', body:fd})).json();
        if (res.error) return alert(res.error);
        connectWs(joiningRoom.id, $('joinPassword').value || '');
    } catch { alert('参加に失敗しました'); }
}

function connectWs(rid, password) {
    roomId = rid;
    const wUrl = API.replace('http://', 'ws://').replace('https://', 'wss://');
    ws = new WebSocket(wUrl + '/ws/' + rid);
    ws.onopen = () => ws.send(JSON.stringify({type:'join', user_id:myId, user_name:myName, password}));
    ws.onmessage = e => handleMsg(JSON.parse(e.data));
    ws.onerror = () => alert('接続エラーが発生しました');
    ws.onclose = () => {
        if (roomId) {
            roomId = null;
            showRoomList();
        }
    };
}

function handleMsg(m) {
    if (m.type === 'joined') {
        roomName = m.room_name;
        $('chatRoomTitle').textContent = roomName;
        show('chatScreen');
        updateUsers(m.users);
        loadHistory();
    } else if (m.type === 'user_joined' || m.type === 'user_left') {
        updateUsers(m.users);
        addSys(m.type === 'user_joined' ? m.user_name + 'さんが参加' : m.user_name + 'さんが退出');
    } else if (m.type === 'user' || m.type === 'agent') {
        addMsg(m);
    } else if (m.type === 'error') { alert(m.message); }
}

async function loadHistory() {
    try {
        const msgs = await (await fetch(API + '/rooms/' + roomId + '/messages?limit=50')).json();
        $('messages').innerHTML = '';
        msgs.forEach(addMsg);
    } catch {}
}

function addMsg(m) {
    const own = m.sender_id === myId || m.sender === myName;
    const div = document.createElement('div');
    div.className = 'msg ' + (own ? 'own' : (m.type==='agent'?'agent':'other'));
    div.innerHTML = '<div class="msg-name">' + esc(m.sender) + '</div><div class="msg-body">' + esc(m.content) + '</div>';
    $('messages').appendChild(div);
    $('messages').scrollTop = $('messages').scrollHeight;
}

function addSys(t) {
    const div = document.createElement('div');
    div.style.cssText = 'text-align:center;font-size:0.75rem;color:#888;padding:4px;';
    div.textContent = t;
    $('messages').appendChild(div);
    $('messages').scrollTop = $('messages').scrollHeight;
}

function updateUsers(users) {
    $('chatUserCount').textContent = users.length + '人在室';
    $('chatUsers').innerHTML = users.map(u => '<span style="margin-right:8px;">' + esc(u.user_name) + (u.user_id===myId?'(あなた)':'') + '</span>').join('');
}

function sendMessage() {
    const t = $('messageInput').value.trim();
    if (!t || !ws) return;
    if (ws.readyState !== WebSocket.OPEN) {
        alert('接続が切れています。ページを更新してください。');
        return;
    }
    ws.send(JSON.stringify({type:'message', sender:myName, content:t}));
    $('messageInput').value = '';
}

function leaveRoom() { if (ws) { ws.close(); ws = null; } roomId = null; showRoomList(); }
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

refreshRooms();
</script>
</body>
</html>
