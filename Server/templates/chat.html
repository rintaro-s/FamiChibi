<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamiChibi Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 20px;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .header p { font-size: 0.85rem; opacity: 0.9; }
        .setup {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }
        .setup input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .setup input:focus { border-color: #f5576c; }
        .setup button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .setup button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
        }
        .chat-area {
            display: none;
            flex-direction: column;
            height: 500px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 12px;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-header {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 3px;
        }
        .message-content {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-left-radius: 4px;
        }
        .message.me .message-content {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-bottom-right-radius: 4px;
            margin-left: auto;
            display: block;
            text-align: right;
        }
        .message.agent .message-content {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }
        .input-area input:focus { border-color: #f5576c; }
        .input-area button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
        }
        .status {
            text-align: center;
            padding: 5px;
            font-size: 0.75rem;
            color: #888;
        }
        .status.connected { color: #28a745; }
        .status.disconnected { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 FamiChibi Chat</h1>
            <p>家族のアバターにメッセージを送ろう！</p>
        </div>
        
        <div class="setup" id="setup">
            <input type="text" id="roomId" placeholder="部屋ID (例: family-room-001)" value="family-room-001">
            <input type="text" id="senderName" placeholder="あなたの名前 (例: お母さん)" value="お母さん">
            <button onclick="joinRoom()">チャットに参加</button>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="status" id="status">接続中...</div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="メッセージを入力..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">送信</button>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let roomId = '';
        let senderName = '';

        function joinRoom() {
            roomId = document.getElementById('roomId').value.trim();
            senderName = document.getElementById('senderName').value.trim() || '匿名';
            
            if (!roomId) {
                alert('部屋IDを入力してください');
                return;
            }
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chatArea').style.display = 'flex';
            
            connectWebSocket();
            loadHistory();
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${roomId}`);
            
            ws.onopen = () => {
                updateStatus('接続完了', 'connected');
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type !== 'pong') {
                    addMessage(msg);
                }
            };
            
            ws.onclose = () => {
                updateStatus('接続切断 - 再接続中...', 'disconnected');
                setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = () => {
                updateStatus('接続エラー', 'disconnected');
            };
        }

        function updateStatus(text, className) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status ' + className;
        }

        async function loadHistory() {
            try {
                const res = await fetch(`/rooms/${roomId}/messages`);
                const messages = await res.json();
                messages.forEach(msg => addMessage(msg));
            } catch (e) {
                console.error('Failed to load history', e);
            }
        }

        function addMessage(msg) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            
            let msgClass = 'user';
            if (msg.sender === senderName) msgClass = 'me';
            else if (msg.type === 'agent') msgClass = 'agent';
            
            const time = new Date(msg.timestamp).toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'});
            
            div.className = `message ${msgClass}`;
            div.innerHTML = `
                <div class="message-header">${msg.sender} · ${time}</div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
            `;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            ws.send(JSON.stringify({
                type: 'message',
                sender: senderName,
                content: content
            }));
            
            input.value = '';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
